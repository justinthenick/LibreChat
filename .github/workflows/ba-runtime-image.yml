name: BA Atomic Multi-Skill Runtime Image

on:
  push:
    branches:
      - 'fix/atomic-multiskill-loader'
    paths:
      - 'config/patch-atomic-skill-chain.js'
      - '.github/workflows/ba-runtime-image.yml'
      - 'packages/api/src/agents/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ba-atomic-multiskill-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply reviewed Synology runtime overlay
        run: |
          node --check config/patch-atomic-skill-chain.js
          node config/patch-atomic-skill-chain.js --tests
          grep -q 'BA_ATOMIC_MULTI_SKILL_V1' packages/api/src/agents/skills.ts
          grep -q 'BA_ATOMIC_MULTI_SKILL_V1' packages/api/src/agents/handlers.ts
          grep -q 'BA_ATOMIC_MULTI_SKILL_TEST_V1' packages/api/src/agents/handlers.spec.ts
          grep -q 'skillNames' packages/api/src/agents/skills.ts
          grep -q 'loaded in dependency order' packages/api/src/agents/handlers.ts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push patched runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/lc-dev:${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Verify image is anonymously pullable
        run: |
          docker logout ghcr.io || true
          docker pull ghcr.io/${{ github.repository_owner }}/lc-dev:${{ github.sha }}
