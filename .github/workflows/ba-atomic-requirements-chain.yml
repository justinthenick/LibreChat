name: BA Atomic Requirements Chain

on:
  pull_request:
    paths:
      - 'custom/ba-agent/skills/prepare-implementation-ready-requirements/**'
      - 'custom/ba-agent/production/ba-supervisor.json'
      - '.github/workflows/ba-atomic-requirements-chain.yml'
  push:
    branches:
      - 'fix/ba-single-requirements-capability'
      - 'server/synology'
    paths:
      - 'custom/ba-agent/skills/prepare-implementation-ready-requirements/**'
      - 'custom/ba-agent/production/ba-supervisor.json'
      - '.github/workflows/ba-atomic-requirements-chain.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate deterministic single requirements capability
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          skill_name = 'prepare-implementation-ready-requirements'
          skill_path = Path('custom/ba-agent/skills') / skill_name / 'SKILL.md'
          assert skill_path.is_file(), f'missing {skill_path}'
          skill = skill_path.read_text()

          expected_id = hashlib.sha1(f'deployment-skill:{skill_name}'.encode()).hexdigest()[:24]
          assert expected_id == 'a285631e35337898e5d79cf8'

          manifest = json.loads(Path('custom/ba-agent/production/ba-supervisor.json').read_text())
          configured = {entry['name']: entry['id'] for entry in manifest['skills']}
          assert configured.get(skill_name) == expected_id

          # The requirements lifecycle is deterministic: one always-primed capability,
          # and no model-callable component skills remain on BA Supervisor.
          component_names = [
              'analyze-requirements',
              'decompose-requirements',
              'elaborate-acceptance-criteria',
          ]
          for name in component_names:
              assert name not in configured, f'{name} must not remain callable from BA Supervisor'
              assert (Path('custom/ba-agent/skills') / name / 'SKILL.md').is_file(), (
                  f'independently benchmarked reference skill missing: {name}'
              )

          instructions = manifest['instructions']
          assert f'`{skill_name}` is pre-primed automatically' in instructions
          assert 'is the sole requirements-lifecycle capability exposed by this Supervisor' in instructions
          assert 'Follow its already-loaded stage-selection rules directly' in instructions
          assert 'Do NOT invoke `prepare-implementation-ready-requirements`, `analyze-requirements`, `decompose-requirements` or `elaborate-acceptance-criteria` through the skill tool' in instructions
          assert 'Execute exactly the requirements stages the user asks for' in instructions
          assert 'do not stop after analysis or ask whether to continue' in instructions

          required_skill_guards = [
              'Execute **exactly the stage or stages requested by the user**',
              'does not prove the current system lacks every bulk mechanism',
              'Do not add a `so that` clause to a user story unless that benefit is evidenced',
              'Do not manufacture assumptions just to populate an Assumptions section',
              'Do not add an **Analyst proposals** section unless the user explicitly asks for recommendations',
              'Never invent UI, API, endpoint, screen, button',
              'Never invent approval, governance, CAB, sponsor, Product Owner, administrator, developer, architect or decision owner',
              'Do not create a Spike, Dependency or Risk simply because a technical unknown or engineering concern is conceivable',
              'does not prove users currently process items one-by-one',
              'Do not invent skip/error/idempotent/reporting semantics',
              'No requirements-lifecycle `skill` tool call is necessary or requested by these instructions',
          ]
          for guard in required_skill_guards:
              assert guard in skill, f'missing lifecycle guard: {guard}'

          # Stage-specific behavior must remain available inside the same deterministic body.
          assert '**Analysis-only** — perform Stage 1 only' in skill
          assert '**Decomposition-only**' in skill
          assert '**Acceptance-criteria-only**' in skill
          assert '**Full lifecycle**' in skill
          assert '# Stage 1 — Requirements analysis' in skill
          assert '# Stage 2 — Delivery decomposition' in skill
          assert '# Stage 3 — Acceptance criteria' in skill

          # Prime before generation and remove both manual/model invocation paths.
          assert re.search(r'^name:\s*prepare-implementation-ready-requirements\s*$', skill, re.M)
          assert re.search(r'^always-apply:\s*true\s*$', skill, re.M)
          assert re.search(r'^user-invocable:\s*false\s*$', skill, re.M)
          assert re.search(r'^disable-model-invocation:\s*true\s*$', skill, re.M)

          # Other downstream capabilities stay callable.
          assert configured['derive-test-cases'] == '0fbc78469a3d76551ca0fb31'
          assert configured['prepare-solution-change-readiness'] == 'a7bcbb732fdc5f370e0e710c'
          assert configured['assess-itil-alignment'] == '4388c6e1d8daec32d2207f47'

          compose = Path('deploy/synology/docker-compose.yml').read_text()
          assert 'DEPLOYMENT_SKILLS_DIR: /app/deployment-skills' in compose
          assert '/volume1/docker/librechat/custom/ba-agent/skills:/app/deployment-skills:ro' in compose
          assert 'image: librechat/lc-dev:cdd4c09076aa43ae9d94bba8f43c55ee35c181d5' in compose
          PY
