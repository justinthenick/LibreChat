name: BA Atomic Requirements Chain

on:
  pull_request:
    paths:
      - 'custom/ba-agent/skills/prepare-implementation-ready-requirements/**'
      - 'custom/ba-agent/production/ba-supervisor.json'
      - '.github/workflows/ba-atomic-requirements-chain.yml'
  push:
    branches:
      - 'fix/ba-always-apply-composite'
      - 'server/synology'
    paths:
      - 'custom/ba-agent/skills/prepare-implementation-ready-requirements/**'
      - 'custom/ba-agent/production/ba-supervisor.json'
      - '.github/workflows/ba-atomic-requirements-chain.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate pre-primed atomic composite routing contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          skill_name = 'prepare-implementation-ready-requirements'
          skill_path = Path('custom/ba-agent/skills') / skill_name / 'SKILL.md'
          assert skill_path.is_file(), f'missing {skill_path}'
          skill = skill_path.read_text()

          expected_id = hashlib.sha1(f'deployment-skill:{skill_name}'.encode()).hexdigest()[:24]
          assert expected_id == 'a285631e35337898e5d79cf8'

          manifest = json.loads(Path('custom/ba-agent/production/ba-supervisor.json').read_text())
          configured = {entry['name']: entry['id'] for entry in manifest['skills']}
          assert configured.get(skill_name) == expected_id

          instructions = manifest['instructions']
          assert f'`{skill_name}` is pre-primed automatically' in instructions
          assert 'follow that already-loaded composite instruction body directly' in instructions
          assert f'Do NOT invoke `{skill_name}`, `analyze-requirements`, `decompose-requirements` or `elaborate-acceptance-criteria` through the skill tool for that combined request' in instructions
          assert 'Do not stop after analysis or ask whether to continue' in instructions
          assert 'For analysis-only requests use `analyze-requirements`' in instructions
          assert 'for decomposition-only requests' in instructions
          assert 'for acceptance-criteria-only requests' in instructions

          # Independently validated component skills remain available for stage-specific work.
          assert configured['analyze-requirements'] == '9c7101672db2ea43ed85d8f2'
          assert configured['decompose-requirements'] == 'f7a4a53d103858849057d1c3'
          assert configured['elaborate-acceptance-criteria'] == '950ef322da7a9972f5b91fcf'

          required_skill_guards = [
              'does not prove users currently perform each item manually',
              'Do not invent benefits such as productivity',
              'Do not invent non-functional requirements',
              'Never invent UI, API, endpoint, screen, button',
              'Never invent approval, governance, CAB, sponsor, Product Owner, administrator, developer, architect or decision owner',
              'does **not** establish whether already-paused items must be skipped, accepted, rejected or reported',
              'The UI/API decision may remain a separate Decision Item without preventing behavioural decomposition',
              'Do not invent skip/error/idempotent behaviour',
              'The response reaches all three requested stages in one consolidated answer',
              'Do not invoke `analyze-requirements`, `decompose-requirements`, `elaborate-acceptance-criteria`, or this skill via the `skill` tool for that combined request',
          ]
          for guard in required_skill_guards:
              assert guard in skill, f'missing composite guard: {guard}'

          # Deterministic orchestration: prime the body before generation and remove the
          # composite from both user and model invocation paths. Agent-scoped always-apply
          # resolution keeps this ambient behavior confined to agents that allowlist the ID.
          assert re.search(r'^name:\s*prepare-implementation-ready-requirements\s*$', skill, re.M)
          assert re.search(r'^always-apply:\s*true\s*$', skill, re.M)
          assert re.search(r'^user-invocable:\s*false\s*$', skill, re.M)
          assert re.search(r'^disable-model-invocation:\s*true\s*$', skill, re.M)

          compose = Path('deploy/synology/docker-compose.yml').read_text()
          assert 'DEPLOYMENT_SKILLS_DIR: /app/deployment-skills' in compose
          assert '/volume1/docker/librechat/custom/ba-agent/skills:/app/deployment-skills:ro' in compose
          assert 'image: librechat/lc-dev:cdd4c09076aa43ae9d94bba8f43c55ee35c181d5' in compose
          PY
