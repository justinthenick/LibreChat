name: BA Production Agents

on:
  pull_request:
    paths:
      - 'custom/ba-agent/production/**'
      - 'custom/ba-agent/skills/validate-release-evidence/**'
      - 'custom/ba-agent/benchmarks/039-o001-ba-release-handoff/**'
      - 'custom/ba-agent/benchmarks/040-release-decision-semantics/**'
      - 'config/seed-production-agents.js'
      - '.github/workflows/ba-production-agents.yml'
  push:
    branches:
      - 'feature/ba-release-production-agents-v0.1'
    paths:
      - 'custom/ba-agent/production/**'
      - 'custom/ba-agent/skills/validate-release-evidence/**'
      - 'custom/ba-agent/benchmarks/039-o001-ba-release-handoff/**'
      - 'custom/ba-agent/benchmarks/040-release-decision-semantics/**'
      - 'config/seed-production-agents.js'
      - '.github/workflows/ba-production-agents.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate seeder JavaScript syntax
        run: node --check config/seed-production-agents.js
      - name: Validate promoted production manifests and semantics
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('custom/ba-agent/production')
          expected = {
              'ba-supervisor.json': 'agent_ba_supervisor_v01',
              'release-change-assurance.json': 'agent_release_change_assurance_v01',
          }
          files = sorted(p.name for p in root.glob('*.json'))
          assert files == sorted(expected), f'unexpected production agent manifests: {files}'
          manifests = {}
          for filename, agent_id in expected.items():
              data = json.loads((root / filename).read_text())
              manifests[agent_id] = data
              assert data['id'] == agent_id
              assert data['status'] == 'validated-for-independent-use'
              assert data['memory_scope'] == 'agent'
              assert data['artifacts'] == 'default'
              assert data['skills_enabled'] is True
              assert data['skills']
              assert set(['file_search', 'execute_code', 'web_search']).issubset(data['tools'])
              assert 'web_fetch' not in data['tools'], 'unsupported standalone web_fetch tool must not be invented'
              policy = data.get('capability_policy', {})
              assert 'ocr' in policy
              assert 'web_fetch' in policy
              assert 'artifacts' in policy

          supervisor = manifests['agent_ba_supervisor_v01']
          release = manifests['agent_release_change_assurance_v01']
          assert supervisor['version'] == '0.1.1'
          assert release['version'] == '0.1.2'
          assert supervisor['subagents']['enabled'] is True
          assert supervisor['subagents']['agent_ids'] == ['agent_release_change_assurance_v01']
          assert 'subagents' not in release, 'Release Assurance must not recursively expose production subagents'

          supervisor_instructions = supervisor['instructions']
          assert 'execute it through to a consolidated answer in the same turn' in supervisor_instructions
          assert 'Do not stop between already-requested stages merely to ask whether to continue' in supervisor_instructions
          assert 'invoke the Release / Change Assurance subagent' in supervisor_instructions
          assert 'Do not substitute prepare-solution-change-readiness' in supervisor_instructions
          assert 'must not be promoted into mandatory gates' in supervisor_instructions
          assert 'release/change is merely future context' in supervisor_instructions

          release_instructions = release['instructions']
          assert 'First identify the decision phase' in release_instructions
          assert 'pre-deployment go/no-go readiness' in release_instructions
          assert 'not-yet-run post-deployment verification do not by themselves count against pre-deployment go/no-go readiness' in release_instructions
          assert 'bare stakeholder or status assertion' in release_instructions
          assert 'Failed result as Failed' in release_instructions
          assert 'applicable release-blocking gate' in release_instructions
          assert 'Missing evidence alone is not automatically NO-GO' in release_instructions
          assert 'Unknown authority' in release_instructions

          skill_path = Path('custom/ba-agent/skills/validate-release-evidence/SKILL.md')
          candidate_skill = skill_path.read_text()
          assert 'Version: **0.3.0**' in candidate_skill
          assert 'Provenance strength' in candidate_skill
          assert 'Claim evidence versus decision sufficiency' in candidate_skill
          assert 'Future-phase discipline' in candidate_skill
          assert 'Failed does not automatically mean NO-GO' in candidate_skill
          assert 'applicable release-blocking gate' in candidate_skill
          assert 'bare stakeholder/status assertion' in candidate_skill
          assert 'Missing evidence alone is not automatically NO-GO' in candidate_skill
          assert 'Unknown` Change Authority' in candidate_skill

          b040_evidence = json.loads(Path('custom/ba-agent/benchmarks/040-release-decision-semantics/activation-evidence.json').read_text())
          assert b040_evidence['gate_passed'] is True
          assert b040_evidence['baseline_final_score'] == 100
          assert b040_evidence['skill_final_score'] == 100
          assert b040_evidence['baseline_gap'] == 0
          assert b040_evidence['critical_penalties'] == 0
          assert b040_evidence['defects'] == 0
          assert b040_evidence['tested_skill_version'] == '0.3.0'
          actual_skill_hash = hashlib.sha256(skill_path.read_bytes()).hexdigest()
          assert actual_skill_hash == b040_evidence['tested_skill_sha256'], 'promoted Skill differs from B040-tested candidate'

          seeder = Path('config/seed-production-agents.js').read_text()
          assert 'subagents: manifest.subagents' in seeder
          assert 'BA Supervisor validated production subagent wiring was not persisted' in seeder

          workflow = json.loads((root / 'workflows/ba-to-release-assurance.json').read_text())
          assert workflow['enabled'] is True, 'O001 passed; production workflow policy must be activated'
          assert workflow['status'] == 'validated-for-production-activation'
          assert workflow['version'] == '0.1.0'
          evidence_rel = workflow['activation_gate']['evidence']
          assert evidence_rel == '../../benchmarks/039-o001-ba-release-handoff/activation-evidence.json'

          evidence_path = (root / 'workflows' / evidence_rel).resolve()
          evidence = json.loads(evidence_path.read_text())
          assert evidence['gate_passed'] is True
          assert evidence['workflow_final_score'] >= workflow['activation_gate']['minimum_score']
          assert evidence['critical_penalties'] <= workflow['activation_gate']['critical_penalties_allowed']
          assert evidence['baseline_gap'] <= workflow['activation_gate']['maximum_baseline_gap']
          assert evidence['defects'] == 0
          assert evidence['tested_candidate_sha256'] == 'b38e942f02340f873bdb0f1ce2e9e20c293b319f002e30b1a738b9b7ddfe3764'

          semantic_policy = {
              key: value for key, value in workflow.items()
              if key not in {'name', 'version', 'status', 'enabled'}
          }
          semantic_policy['activation_gate'] = {
              key: value for key, value in semantic_policy['activation_gate'].items()
              if key != 'evidence'
          }
          canonical = json.dumps(
              semantic_policy,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ).encode('utf-8')
          semantic_hash = hashlib.sha256(canonical).hexdigest()
          assert semantic_hash == evidence['semantic_policy_sha256'], (
              'activated workflow semantics differ from the O001-tested policy'
          )
          PY
      - name: Validate Benchmark 039 activation evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom/ba-agent/benchmarks/039-o001-ba-release-handoff')
          required = [
              'benchmark.json', 'input.md', 'prompt.md', 'gold-standard.md',
              'scoring-rubric.md', 'activation-evidence.json'
          ]
          for name in required:
              assert (root / name).is_file(), f'missing {name}'
          benchmark = json.loads((root / 'benchmark.json').read_text())
          assert benchmark['skill'] == '../../production/workflows/ba-to-release-assurance.json'
          rubric = (root / 'scoring-rubric.md').read_text()
          assert 'score >= 90/100' in rubric
          assert 'no critical penalties' in rubric
          evidence = json.loads((root / 'activation-evidence.json').read_text())
          assert evidence['gate_passed'] is True
          assert evidence['baseline_final_score'] == 100
          assert evidence['workflow_final_score'] == 100
          assert evidence['baseline_gap'] == 0
          assert evidence['critical_penalties'] == 0
          PY
      - name: Validate Benchmark 040 activation evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('custom/ba-agent/benchmarks/040-release-decision-semantics')
          required = [
              'benchmark.json', 'input.md', 'prompt.md', 'gold-standard.md',
              'scoring-rubric.md', 'activation-evidence.json'
          ]
          for name in required:
              assert (root / name).is_file(), f'missing Benchmark 040 {name}'

          benchmark = json.loads((root / 'benchmark.json').read_text())
          assert benchmark['skill'] == '../../skills/validate-release-evidence/SKILL.md'

          input_text = (root / 'input.md').read_text()
          prompt = (root / 'prompt.md').read_text()
          gold = (root / 'gold-standard.md').read_text()
          rubric = (root / 'scoring-rubric.md').read_text()

          assert 'no underlying uat report' in input_text.lower()
          assert 'diagnostic compatibility check reports **FAILED**' in input_text
          assert 'does **not** identify this diagnostic' in input_text
          assert 'pre-deployment go/no-go readiness' in prompt
          assert 'reported / Partially evidenced' in prompt
          assert 'applicable release-blocking gate' in prompt
          assert 'neither is established' in gold
          assert 'release-gate applicability is Not established' in gold
          assert 'reported / Partially evidenced' in gold
          assert 'Production deployment and production verification are future-phase activities' in gold
          assert 'Unknown authority vs blocker' in gold
          assert 'Automatic fail conditions' in rubric
          assert 'PASS: 90/100 or higher' in rubric
          assert 'optional-browser diagnostic failed without establishing that diagnostic as an applicable release-blocking gate' in rubric
          assert 'upgrades the bare “8 sample inspections passed” status assertion to Verified' in rubric

          evidence = json.loads((root / 'activation-evidence.json').read_text())
          assert evidence['semantic_job'] == 'sem-b040-release-decision-semantics-g37-001'
          assert evidence['generation_model'] == 'gemini-3.7-flash'
          assert evidence['evaluator_model'] == 'gemini-3.7-flash'
          assert evidence['baseline_final_score'] == 100
          assert evidence['skill_final_score'] == 100
          assert evidence['baseline_gap'] == 0
          assert evidence['critical_penalties'] == 0
          assert evidence['gate_passed'] is True
          assert evidence['source_lab_branch'] == 'feature/ba-agent-v0.1'
          assert evidence['source_lab_commit'] == 'a86c1648f03e04b8e25fb66e9825668635c9c5e7'
          assert evidence['source_evaluation_path'].endswith('sem-b040-release-decision-semantics-g37-001-semantic-evaluation.md')
          PY
