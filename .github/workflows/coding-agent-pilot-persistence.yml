name: Coding Agent Pilot Persistence

on:
  pull_request:
    paths:
      - 'config/seed-coding-agent-pilot.js'
      - 'config/__tests__/pilot-maintenance.test.cjs'
      - 'config/__tests__/seed-coding-agent-pilot.spec.js'
      - 'config/__tests__/seed-coding-agent-pilot.spec.js'
      - 'custom/coding-agent/production/software-engineering-pilot.json'
      - 'custom/coding-agent/benchmarks/SKILL-PILOT-001/**'
      - 'deploy/synology/docker-compose.yml'
      - 'deploy/synology/autodeploy.sh'
      - '.github/workflows/coding-agent-pilot-persistence.yml'
  push:
    branches:
      - server/synology
    paths:
      - 'config/seed-coding-agent-pilot.js'
      - 'config/__tests__/pilot-maintenance.test.cjs'
      - 'custom/coding-agent/production/software-engineering-pilot.json'
      - 'custom/coding-agent/benchmarks/SKILL-PILOT-001/**'
      - 'deploy/synology/docker-compose.yml'
      - 'deploy/synology/autodeploy.sh'
      - '.github/workflows/coding-agent-pilot-persistence.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate seeder syntax
        run: node --check config/seed-coding-agent-pilot.js

      - name: Validate persistent pilot contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('custom/coding-agent/production/software-engineering-pilot.json').read_text()
          )
          expected = {
              'list_repositories',
              'create_task',
              'task_status',
              'list_files',
              'read_file',
              'search_text',
              'apply_patch',
              'run_check',
              'git_diff',
          }
          assert manifest['id'] == 'agent_software_engineering_pilot_v01'
          assert manifest['status'] == 'validated-for-persistent-pilot'
          assert manifest['version'] == '0.1.17'
          assert manifest['provider'] == 'google'
          assert manifest['preferred_model'] == 'gemini-3.8-flash'
          assert manifest['evidence']['model'] == 'google/gemini-3.7-flash'
          promotion = manifest['evidence']['default_model_promotion']
          assert promotion['date'] == '2026-09-30'
          assert promotion['from'] == 'google/gemini-3.7-flash'
          assert promotion['to'] == 'google/gemini-3.8-flash'
          assert promotion['source_commit'] == '96888c95e9cd2c938279e26bc51c5235dd10cfb6'
          assert promotion['candidate_task'] == 'surface-coding-agent-status-75889d15'
          assert promotion['baseline_task'] == 'surface-coding-agent-status-dad2925f'
          assert promotion['result'] == 'PROMOTED'
          assert manifest['mcp_server'] == 'coding_executor'
          assert set(manifest['mcp_tools']) == expected
          assert len(manifest['mcp_tools']) == len(expected)
          assert manifest['deployment']['production_seeder'] == 'enabled'
          assert manifest['skills_enabled'] is True
          assert manifest['skills'] == [
              {
                  'name': 'codebase-design',
                  'source': 'github',
                  'source_id': 'coding-agent-skills',
                  'owner': 'justinthenick',
                  'repo': 'LibreChat',
                  'ref': 'server/synology',
                  'path': '.agents/skills/codebase-design',
              },
              {
                  'name': 'systematic-debugging',
                  'source': 'github',
                  'source_id': 'managed-skills',
                  'owner': 'justinthenick',
                  'repo': 'LibreChat',
                  'ref': 'server/synology',
                  'path': 'managed-skills/skills/systematic-debugging',
              },
              {
                  'name': 'test-driven-development',
                  'source': 'github',
                  'source_id': 'managed-skills',
                  'owner': 'justinthenick',
                  'repo': 'LibreChat',
                  'ref': 'server/synology',
                  'path': 'managed-skills/skills/test-driven-development',
              },
              {
                  'name': 'verification-before-completion',
                  'source': 'github',
                  'source_id': 'managed-skills',
                  'owner': 'justinthenick',
                  'repo': 'LibreChat',
                  'ref': 'server/synology',
                  'path': 'managed-skills/skills/verification-before-completion',
              },
          ]
          instructions = manifest['instructions']
          assert 'task_mode=read_only' in instructions
          assert 'task_mode=modification' in instructions
          assert 'Never create a replacement task to bypass an exploration budget.' in instructions
          assert 'enforced pre-patch mutation checkpoint at 12 exploratory calls' in instructions
          assert 'Do not spend calls 13-16 gathering more confidence before the first patch' in instructions
          assert 'up to four post-patch exploratory calls may be available' in instructions
          assert 'apply_patch remains available for any otherwise-valid task path needed to complete the already-justified implementation' in instructions
          assert 'SKILL POLICY: exactly four validated methodology skills are enabled' in instructions
          assert 'Invoke codebase-design before substantive repository analysis' in instructions
          assert 'Invoke systematic-debugging when a coding task involves a bug' in instructions
          assert 'Invoke test-driven-development for behavior-changing features' in instructions
          assert 'Invoke verification-before-completion before claiming that coding work is complete' in instructions
          assert 'Do not substitute generic methodology for a required skill invocation.' in instructions
          assert 'EXECUTOR AVAILABILITY POLICY:' in instructions
          assert 'Do not repeat a tool call after a circuit-breaker-open error.' in instructions
          assert 'never expands coding_executor permissions' in instructions
          assert 'When executor run_check returns exit code 126 with command_not_allowed, never describe that rejected command as having succeeded or use it as evidence.' in instructions
          assert 'MUTATION-AS-INSPECTION POLICY:' in instructions
          assert 'A mutation whose purpose is to expose unread source is a policy violation even if the mutation is later reverted.' in instructions
          assert 'Evidence obtained through mutation-as-inspection is invalid and must not guide further analysis or changes.' in instructions
          assert 'If permitted exploration is insufficient, stop and report the limitation; never manufacture another inspection path.' in instructions
          assert manifest['maintenance_mcp_server'] == 'coding_maintenance'
          assert set(manifest['maintenance_mcp_tools']) == {'executor_health', 'repository_status', 'task_inventory', 'executor_logs', 'fresh_repository_status', 'validate_promotion_candidate', 'preview_cleanup', 'cleanup_task'}
          assert len(manifest['maintenance_mcp_tools']) == 8
          assert 'Do not call create_task or any coding_executor tool to perform them.' in instructions
          assert 'report the integration failure and stop' in instructions
          assert 'validate_promotion_candidate' in instructions
          assert 'Validation does not replace human promotion approval.' in instructions
          assert 'For every task, first list' not in instructions

          seeder = Path('config/seed-coding-agent-pilot.js').read_text()
          compose = Path('deploy/synology/docker-compose.yml').read_text()
          deploy = Path('deploy/synology/autodeploy.sh').read_text()

          assert 'sys__all__sys_mcp_' not in json.dumps(manifest)
          assert "${tool}_mcp_${manifest.mcp_server}" in seeder
          assert 'mcpServerNames: [manifest.mcp_server, MAINTENANCE_SERVER]' in seeder
          assert "const GOOGLE_ENDPOINT_NAME = 'google';" in seeder
          assert "normalized === 'google'" in seeder
          assert 'agent.provider !== expectedProvider' in seeder
          assert 'provider: agent.provider' in seeder
          assert 'findSkillBySourceIdentity' in seeder
          assert "sourceId: 'coding-agent-skills'" in seeder
          assert "sourceId: 'managed-skills'" in seeder
          assert "path: '.agents/skills/codebase-design'" in seeder
          assert "path: 'managed-skills/skills/systematic-debugging'" in seeder
          assert "path: 'managed-skills/skills/test-driven-development'" in seeder
          assert "path: 'managed-skills/skills/verification-before-completion'" in seeder
          assert 'skills: skillIds' in seeder
          assert 'skills_enabled: manifest.skills_enabled === true' in seeder
          assert 'expectedSkillIds.length !== EXPECTED_SKILLS.length' in seeder
          assert 'refusing to widen the allowlist' in seeder
          assert 'seed-coding-agent-pilot.js /app/coding-agent-pilot' in compose
          assert '/custom/coding-agent/production:/app/coding-agent-pilot:ro' in compose
          assert 'node /app/config/seed-coding-agent-pilot.js /app/coding-agent-pilot' in deploy
          assert 'production_agent_seed >/dev/null 2>&1' in deploy
          print('persistent coding-agent pilot contract OK')
          PY

      - name: Validate pilot instruction regressions
        run: node --test config/__tests__/pilot-maintenance.test.cjs

      - name: Validate shell syntax
        run: sh -n deploy/synology/autodeploy.sh
