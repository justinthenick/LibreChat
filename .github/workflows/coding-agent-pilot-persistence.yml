name: Coding Agent Pilot Persistence

on:
  pull_request:
    paths:
      - 'config/seed-coding-agent-pilot.js'
      - 'custom/coding-agent/production/software-engineering-pilot.json'
      - 'custom/coding-agent/benchmarks/SKILL-PILOT-001/**'
      - 'deploy/synology/docker-compose.yml'
      - 'deploy/synology/autodeploy.sh'
      - '.github/workflows/coding-agent-pilot-persistence.yml'
  push:
    branches:
      - server/synology
    paths:
      - 'config/seed-coding-agent-pilot.js'
      - 'custom/coding-agent/production/software-engineering-pilot.json'
      - 'custom/coding-agent/benchmarks/SKILL-PILOT-001/**'
      - 'deploy/synology/docker-compose.yml'
      - 'deploy/synology/autodeploy.sh'
      - '.github/workflows/coding-agent-pilot-persistence.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate seeder syntax
        run: node --check config/seed-coding-agent-pilot.js

      - name: Validate persistent pilot contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('custom/coding-agent/production/software-engineering-pilot.json').read_text()
          )
          expected = {
              'list_repositories',
              'create_task',
              'task_status',
              'list_files',
              'read_file',
              'search_text',
              'apply_patch',
              'run_check',
              'git_diff',
          }
          assert manifest['id'] == 'agent_software_engineering_pilot_v01'
          assert manifest['status'] == 'validated-for-persistent-pilot'
          assert manifest['version'] == '0.1.10'
          assert manifest['provider'] == 'google'
          assert manifest['preferred_model'] == 'gemini-3.7-flash'
          assert manifest['evidence']['model'] == 'google/gemini-3.7-flash'
          assert manifest['mcp_server'] == 'coding_executor'
          assert set(manifest['mcp_tools']) == expected
          assert len(manifest['mcp_tools']) == len(expected)
          assert manifest['deployment']['production_seeder'] == 'enabled'
          assert manifest['skills_enabled'] is True
          assert manifest['skills'] == [{
              'name': 'codebase-design',
              'source': 'github',
              'source_id': 'coding-agent-skills',
              'owner': 'justinthenick',
              'repo': 'LibreChat',
              'ref': 'server/synology',
              'path': '.agents/skills/codebase-design',
          }]
          instructions = manifest['instructions']
          assert 'task_mode=read_only' in instructions
          assert 'task_mode=modification' in instructions
          assert 'Never create a replacement task to bypass an exploration budget.' in instructions
          assert 'SKILL POLICY: codebase-design is the only enabled skill.' in instructions
          assert 'invoke the codebase-design skill tool before substantive repository analysis' in instructions
          assert 'Do not substitute generic design knowledge for a requested skill invocation.' in instructions
          assert 'EXECUTOR AVAILABILITY POLICY:' in instructions
          assert 'Do not repeat a tool call after a circuit-breaker-open error.' in instructions
          assert 'never expands coding_executor permissions' in instructions
          assert 'When executor run_check returns exit code 126 with command_not_allowed, never describe that rejected command as having succeeded or use it as evidence.' in instructions
          assert manifest['maintenance_mcp_server'] == 'coding_maintenance'
          assert set(manifest['maintenance_mcp_tools']) == {'executor_health', 'repository_status', 'task_inventory', 'executor_logs'}
          assert len(manifest['maintenance_mcp_tools']) == 4
          assert 'Do not call create_task or any coding_executor tool to perform them.' in instructions
          assert 'report the integration failure and stop' in instructions
          assert 'For every task, first list' not in instructions

          seeder = Path('config/seed-coding-agent-pilot.js').read_text()
          compose = Path('deploy/synology/docker-compose.yml').read_text()
          deploy = Path('deploy/synology/autodeploy.sh').read_text()

          assert 'sys__all__sys_mcp_' not in json.dumps(manifest)
          assert "${tool}_mcp_${manifest.mcp_server}" in seeder
          assert 'mcpServerNames: [manifest.mcp_server, MAINTENANCE_SERVER]' in seeder
          assert "const GOOGLE_ENDPOINT_NAME = 'google';" in seeder
          assert "normalized === 'google'" in seeder
          assert 'agent.provider !== expectedProvider' in seeder
          assert 'provider: agent.provider' in seeder
          assert 'findSkillBySourceIdentity' in seeder
          assert "sourceId: 'coding-agent-skills'" in seeder
          assert "path: '.agents/skills/codebase-design'" in seeder
          assert 'skills: skillIds' in seeder
          assert 'skills_enabled: manifest.skills_enabled === true' in seeder
          assert 'expectedSkillIds.length !== 1' in seeder
          assert 'refusing to widen the allowlist' in seeder
          assert 'seed-coding-agent-pilot.js /app/coding-agent-pilot' in compose
          assert '/custom/coding-agent/production:/app/coding-agent-pilot:ro' in compose
          assert 'node /app/config/seed-coding-agent-pilot.js /app/coding-agent-pilot' in deploy
          assert 'production_agent_seed >/dev/null 2>&1' in deploy
          print('persistent coding-agent pilot contract OK')
          PY

      - name: Validate shell syntax
        run: sh -n deploy/synology/autodeploy.sh
