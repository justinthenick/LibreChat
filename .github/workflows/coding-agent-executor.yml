name: Coding Agent Executor

on:
  pull_request:
    paths:
      - 'config/seed-coding-agent-pilot.js'
      - 'config/__tests__/pilot-maintenance.test.cjs'
      - 'custom/coding-agent/production/**'
      - 'deploy/synology/librechat.yaml'
      - 'deploy/synology/render-librechat-config.py'
      - 'deploy/synology/test_maintenance_integration.py'
      - 'custom/coding-agent/executor/**'
      - 'custom/coding-agent/host/**'
      - 'custom/coding-agent/benchmarks/SRC-PREFLIGHT-001/**'
      - 'custom/coding-agent/benchmarks/C002-real-extension-regression/activation-evidence.json'
      - 'custom/coding-agent/benchmarks/C003-new-file-module-extraction/**'
      - '.github/workflows/coding-agent-executor.yml'
  push:
    branches:
      - server/synology
    paths:
      - 'config/seed-coding-agent-pilot.js'
      - 'config/__tests__/pilot-maintenance.test.cjs'
      - 'custom/coding-agent/production/**'
      - 'deploy/synology/librechat.yaml'
      - 'deploy/synology/render-librechat-config.py'
      - 'deploy/synology/test_maintenance_integration.py'
      - 'custom/coding-agent/executor/**'
      - 'custom/coding-agent/host/**'
      - 'custom/coding-agent/benchmarks/SRC-PREFLIGHT-001/**'
      - 'custom/coding-agent/benchmarks/C002-real-extension-regression/activation-evidence.json'
      - 'custom/coding-agent/benchmarks/C003-new-file-module-extraction/**'
      - '.github/workflows/coding-agent-executor.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Pilot maintenance exposure and endpoint rendering
        run: |
          node --test config/__tests__/pilot-maintenance.test.cjs
          python -m unittest discover -s deploy/synology -p test_maintenance_integration.py -v

      - name: Install executor and host maintenance
        run: python -m pip install -e custom/coding-agent/executor -e custom/coding-agent/host

      - name: Run executor tests
        working-directory: custom/coding-agent/executor
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src tests

      - name: Run host preflight and maintenance tests
        working-directory: custom/coding-agent/host
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src tests

      - name: Verify disposable container maintenance lifecycle
        run: |
          docker build -t coding-maintenance-ci custom/coding-agent/executor
          PYTHONPATH=custom/coding-agent/executor/src:custom/coding-agent/host/src \
            python -B custom/coding-agent/host/tests/staging_smoke.py coding-maintenance-ci

      - name: Validate trusted-host automation
        run: |
          bash -n custom/coding-agent/host/bin/sync-librechat-source.sh
          bash -n custom/coding-agent/host/bin/install-source-sync-timer.sh
          bash -n custom/coding-agent/host/bin/deploy-maintenance-release.sh
          grep -F 'OnUnitInactiveSec=5min' custom/coding-agent/host/systemd/coding-agent-source-sync.timer
          grep -F 'source_preflight.cli' custom/coding-agent/host/bin/sync-librechat-source.sh
          grep -F 'PYTHONDONTWRITEBYTECODE=1' custom/coding-agent/host/bin/sync-librechat-source.sh
          grep -F 'python3 -B -m source_preflight.cli' custom/coding-agent/host/bin/sync-librechat-source.sh
          grep -F '.source-sync.lock' custom/coding-agent/host/bin/sync-librechat-source.sh
          grep -F '.source-sync.lock' custom/coding-agent/executor/src/coding_executor/workspaces.py
          ! grep -E 'reset --hard|clean -f|rebase|push --force' custom/coding-agent/host/bin/sync-librechat-source.sh
