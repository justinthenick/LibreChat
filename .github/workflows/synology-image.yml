name: Synology Application Image

on:
  workflow_dispatch:
  push:
    branches:
      - server/synology
      - 'release/synology-*'
    paths:
      - '.github/workflows/synology-image.yml'
      - 'deploy/synology/smoke-image.sh'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'config/**'
      - 'skill/**'
      - 'custom/ba-agent/production/**'
      - 'custom/ba-agent/skills/**'
      - 'custom/coding-agent/production/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: synology-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, boot and publish Synology image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Set image identity
        id: identity
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/librechat-synology" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build complete application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.identity.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.identity.outputs.date }}
          cache-from: type=gha,scope=synology-node
          cache-to: type=gha,mode=max,scope=synology-node
      - name: Verify image and NAS startup contracts
        env:
          IMAGE: ${{ steps.identity.outputs.image }}:${{ github.sha }}
        run: sh deploy/synology/smoke-image.sh "$IMAGE" "$GITHUB_SHA"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the tested image
        env:
          IMAGE: ${{ steps.identity.outputs.image }}:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          {
            echo '### Tested Synology application image'
            echo "Source: $GITHUB_SHA"
            echo "Tag: $IMAGE"
            echo "Pin: $digest"
            echo 'Production is unchanged until this digest is reviewed and pinned in deploy/synology/docker-compose.yml.'
          } >> "$GITHUB_STEP_SUMMARY"
