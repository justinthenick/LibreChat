name: Synology Admin Panel Extension

on:
  pull_request:
    paths:
      - 'deploy/synology/admin-panel-extension/**'
      - 'deploy/synology/deployment-frame-proxy.py'
      - 'deploy/synology/test_deployment_frame_proxy.py'
      - 'deploy/synology/docker-compose.admin.yml'
      - '.github/workflows/synology-admin-panel-extension.yml'
  push:
    branches:
      - server/synology
    paths:
      - 'deploy/synology/admin-panel-extension/**'
      - 'deploy/synology/deployment-frame-proxy.py'
      - 'deploy/synology/test_deployment_frame_proxy.py'
      - 'deploy/synology/docker-compose.admin.yml'
      - '.github/workflows/synology-admin-panel-extension.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment gateway
        run: |
          python -m py_compile deploy/synology/deployment-frame-proxy.py
          python -m unittest -v deploy/synology/test_deployment_frame_proxy.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build extension image
        uses: docker/build-push-action@v6
        with:
          context: deploy/synology/admin-panel-extension
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/justinthenick/librechat-admin-panel-synology:server-synology
            ghcr.io/justinthenick/librechat-admin-panel-synology:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
