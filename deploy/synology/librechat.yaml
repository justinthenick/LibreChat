version: 1.3.13

cache: false

interface:
  customWelcome: 'LibreChat on Synology'
  modelSelect: true
  parameters: true
  presets: true
  webSearch: true
  runCode: true
  memories: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: false
    public: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  fileSearch: false
  marketplace:
    use: false

# Memory is enabled globally, while each production agent must explicitly opt in
# with memory_scope. BA Supervisor and Release / Change Assurance use isolated
# per-agent memory rather than silently sharing one memory pool.
memory:
  disabled: false

# Tavily is the initial managed web-search backend. LibreChat's supported page-
# fetch/extraction path is the web_search scraper provider rather than a separate
# web_fetch Agent capability/tool in this checkout.
webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  rerankerType: none
  tavilyApiKey: '${TAVILY_API_KEY}'

# OCR is an Agent endpoint capability with its own top-level runtime service
# configuration. The Mistral OCR strategy becomes operational when the managed
# OCR service credential/base URL are configured in Admin Settings.
ocr:
  apiKey: '${OCR_API_KEY}'
  baseURL: '${OCR_BASEURL}'
  strategy: mistral_ocr

mcpServers:
  filesystem:
    type: stdio
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem@2026.1.14'
      - /workspace
    timeout: 120000

endpoints:
  # Deliberately pin the production capability set instead of inheriting future
  # upstream additions. These are enabled for the BA Supervisor and Release /
  # Change Assurance rollout; individual agents still control which tools they
  # actually receive.
  agents:
    capabilities:
      - deferred_tools
      - file_search
      - execute_code
      - web_search
      - memory
      - actions
      - run_in_background
      - ocr
      - artifacts
      - subagents
      - context
      - skills
      - tools
      - chain
      - ask_user_question
    skills:
      maxCatalogSkills: 100

  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      # BEGIN MANAGED OPENROUTER MODELS
      # render-librechat-config.py replaces only this block in the runtime copy.
      # With no managed allowlist, keep the historical default and fetch the
      # complete provider catalogue.
      models:
        default:
          - 'deepseek/deepseek-v3.2'
        fetch: true
      # END MANAGED OPENROUTER MODELS
      titleConvo: true
      titleModel: 'deepseek/deepseek-v3.2'
      summarize: false
      forcePrompt: false
      modelDisplayLabel: 'OpenRouter'
