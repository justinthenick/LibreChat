version: 1.3.13

cache: false

interface:
  customWelcome: 'LibreChat on Synology'
  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: false
    public: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  fileSearch: false
  marketplace:
    use: false

mcpServers:
  filesystem:
    type: stdio
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem@2026.1.14'
      - /workspace
    timeout: 120000

endpoints:
  # Pin the capabilities we have intentionally enabled/tested instead of inheriting
  # an expanding upstream default set. Code execution, web search, actions, memory,
  # OCR and background execution remain off until separately engineered.
  agents:
    capabilities:
      - deferred_tools
      - file_search
      - subagents
      - context
      - skills
      - tools
      - chain
      - ask_user_question
    skills:
      maxCatalogSkills: 100

  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      # BEGIN MANAGED OPENROUTER MODELS
      # render-librechat-config.py replaces only this block in the runtime copy.
      # With no managed allowlist, keep the historical default and fetch the
      # complete provider catalogue.
      models:
        default:
          - 'deepseek/deepseek-v3.2'
        fetch: true
      # END MANAGED OPENROUTER MODELS
      titleConvo: true
      titleModel: 'deepseek/deepseek-v3.2'
      summarize: false
      forcePrompt: false
      modelDisplayLabel: 'OpenRouter'
