version: 1.3.13

cache: false

interface:
  customWelcome: 'LibreChat on Synology'
  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: false
    public: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  fileSearch: false
  marketplace:
    use: false

mcpServers:
  filesystem:
    type: stdio
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem@2026.1.14'
      - /workspace
    timeout: 120000

endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          - 'deepseek/deepseek-v3.2'
        fetch: true
      titleConvo: true
      titleModel: 'deepseek/deepseek-v3.2'
      summarize: false
      forcePrompt: false
      modelDisplayLabel: 'OpenRouter'
