version: 1.3.14

cache: false

interface:
  customWelcome: 'LibreChat on Synology'
  modelSelect: true
  parameters: true
  presets: true
  webSearch: true
  runCode: true
  memories: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: false
    public: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  fileSearch: false
  marketplace:
    use: false

memory:
  disabled: false

# Tavily is the managed web-search + page-extraction backend.
webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  rerankerType: none
  tavilyApiKey: '${TAVILY_API_KEY}'

ocr:
  apiKey: '${OCR_API_KEY}'
  baseURL: '${OCR_BASEURL}'
  strategy: mistral_ocr

mcpServers:
  filesystem:
    type: stdio
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem@2026.1.14'
      - /workspace
    timeout: 120000

endpoints:
  agents:
    capabilities:
      - deferred_tools
      - file_search
      - execute_code
      - web_search
      - actions
      - ocr
      - artifacts
      - subagents
      - context
      - skills
      - tools
      - chain
      - stateful_code_sessions
    # Retain LibreChat's human-in-the-loop machinery for attached execution.
    # `bypass` lets the user choose Ask / Accept edits / Full access per turn;
    # the worker sandbox remains an independent enforcement boundary.
    toolApproval:
      enabled: true
      mode: bypass
    statefulCodeSessions:
      allowedEnvironments:
        - conversation
      environments:
        - id: justin-wsl
          name: 'Justin WSL Code Worker'
          type: attached
          baseURL: 'http://librechat-codeapi:3112/v1'
          default: true
          workerId: justin-wsl
          owner: deployment
          configSchema:
            permissions:
              fileWrite:
                allowed: [ask, allow]
                default: ask
              commandExecution:
                allowed: [ask, allow]
                default: ask
    skills:
      maxCatalogSkills: 100

  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      # BEGIN MANAGED OPENROUTER MODELS
      # render-librechat-config.py replaces only this block in the runtime copy.
      # With no managed allowlist, keep the historical default and fetch the
      # complete provider catalogue.
      models:
        default:
          - 'deepseek/deepseek-v3.2'
        fetch: true
      # END MANAGED OPENROUTER MODELS
      titleConvo: true
      titleModel: 'deepseek/deepseek-v3.2'
      summarize: false
      forcePrompt: false
      modelDisplayLabel: 'OpenRouter'
