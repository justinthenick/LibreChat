version: "3.7"

# Synology administration overlay.
#
# Two deliberately separate surfaces run here:
# 1) the official LibreChat Admin Panel for application administration; and
# 2) the custom Synology Deployment Settings panel for host-side .env/deployment
#    changes, validation, selective recreation, health checks, and rollback.
#
# The custom deployment-settings panel has NO .env mount and NO Docker socket.
# Routine browser access uses password-backed HttpOnly sessions stored under
# /state; the host recovery token is retained only for bootstrap/emergency use.
services:
  admin-panel:
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    container_name: librechat-admin-panel
    restart: unless-stopped
    ports:
      - "${ADMIN_PANEL_PORT:-3220}:3000"
    environment:
      PORT: "3000"
      # Backward-compatible fallback lets the first deployment start before the
      # updated bootstrap has created the dedicated session secret. Re-run
      # bootstrap-admin-settings.py after deployment so this uses its own secret.
      SESSION_SECRET: "${ADMIN_PANEL_SESSION_SECRET:-${ADMIN_SETTINGS_ACCESS_TOKEN}}"
      API_SERVER_URL: http://api:3080
      VITE_API_BASE_URL: "${LIBRECHAT_SCHEME:-http}://${NAS_HOST}:${LIBRECHAT_PORT:-3200}"
      SESSION_COOKIE_SECURE: "${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}"
    depends_on:
      - api
    networks:
      - librechat

  admin-settings:
    image: python:3.12-alpine
    container_name: librechat-admin-settings
    restart: unless-stopped
    user: "1026:100"
    command: python3 /app/admin-settings-panel.py
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      ADMIN_SETTINGS_ACCESS_TOKEN: "${ADMIN_SETTINGS_ACCESS_TOKEN}"
      ADMIN_SETTINGS_PORT: "3210"
      ADMIN_SETTINGS_SOCKET: /state/worker.sock
      ADMIN_SETTINGS_AUTH_FILE: /state/auth.json
      ADMIN_SETTINGS_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
    ports:
      - "${ADMIN_SETTINGS_PORT:-3210}:3210"
    volumes:
      - ./admin-settings-panel.py:/app/admin-settings-panel.py:ro
      - /volume1/docker/librechat/admin-settings-state:/state
    networks:
      - librechat
