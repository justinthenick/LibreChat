version: "3.7"

# Optional Synology Admin Settings panel. autodeploy.sh loads this overlay only
# when the private host recovery credential is configured.
#
# The panel deliberately has NO .env mount and NO Docker socket. Routine browser
# access uses password-backed HttpOnly sessions stored under /state; the host
# token is retained only for bootstrap/emergency recovery.
services:
  admin-settings:
    image: python:3.12-alpine
    container_name: librechat-admin-settings
    restart: unless-stopped
    user: "1026:100"
    command: python3 /app/admin-settings-panel.py
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      ADMIN_SETTINGS_ACCESS_TOKEN: "${ADMIN_SETTINGS_ACCESS_TOKEN}"
      ADMIN_SETTINGS_PORT: "3210"
      ADMIN_SETTINGS_SOCKET: /state/worker.sock
      ADMIN_SETTINGS_AUTH_FILE: /state/auth.json
      ADMIN_SETTINGS_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
    ports:
      - "${ADMIN_SETTINGS_PORT:-3210}:3210"
    volumes:
      - ./admin-settings-panel.py:/app/admin-settings-panel.py:ro
      - /volume1/docker/librechat/admin-settings-state:/state
    networks:
      - librechat
