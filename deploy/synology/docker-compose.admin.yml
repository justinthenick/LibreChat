version: "3.7"

# Synology administration overlay.
#
# LibreChat application administration stays in the upstream-derived Admin Panel.
# Synology Deployment Settings retains the privileged host/deployment boundary
# behind the restricted worker. The Admin Panel exposes it at the same-origin
# /deployment-control/ path through an internal-only frame gateway.
services:
  admin-panel:
    image: ghcr.io/justinthenick/librechat-admin-panel-synology:server-synology
    container_name: librechat-admin-panel
    restart: unless-stopped
    ports:
      - "${ADMIN_PANEL_PORT:-3220}:3000"
    environment:
      PORT: "3000"
      SESSION_SECRET: "${ADMIN_PANEL_SESSION_SECRET:?Run bootstrap-admin-settings.py --ensure-session-secret first}"
      API_SERVER_URL: http://api:3080
      VITE_API_BASE_URL: "${LIBRECHAT_SCHEME:-http}://${NAS_HOST}:${LIBRECHAT_PORT:-3200}"
      SESSION_COOKIE_SECURE: "${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}"
      DEPLOYMENT_GATEWAY_URL: http://deployment-frame-gateway:3211
    depends_on:
      - api
      - deployment-frame-gateway
    networks:
      - librechat

  admin-settings:
    image: python:3.12-alpine
    container_name: librechat-admin-settings
    restart: unless-stopped
    user: "1026:100"
    command: python3 /app/admin-settings-panel.py
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      ADMIN_SETTINGS_ACCESS_TOKEN: "${ADMIN_SETTINGS_ACCESS_TOKEN}"
      ADMIN_SETTINGS_PORT: "3210"
      ADMIN_SETTINGS_SOCKET: /state/worker.sock
      ADMIN_SETTINGS_AUTH_FILE: /state/auth.json
      ADMIN_SETTINGS_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
    ports:
      - "${ADMIN_SETTINGS_PORT:-3210}:3210"
    volumes:
      - ./admin-settings-panel.py:/app/admin-settings-panel.py:ro
      - /volume1/docker/librechat/admin-settings-state:/state
    networks:
      - librechat

  deployment-frame-gateway:
    image: python:3.12-alpine
    container_name: librechat-deployment-frame-gateway
    restart: unless-stopped
    command: python3 /app/deployment-frame-proxy.py
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      DEPLOYMENT_GATEWAY_PORT: "3211"
      DEPLOYMENT_GATEWAY_UPSTREAM: "http://admin-settings:3210"
      DEPLOYMENT_GATEWAY_FRAME_ANCESTOR: "${LIBRECHAT_SCHEME:-http}://${NAS_HOST}:${ADMIN_PANEL_PORT:-3220}"
    expose:
      - "3211"
    volumes:
      - ./deployment-frame-proxy.py:/app/deployment-frame-proxy.py:ro
    depends_on:
      - admin-settings
    networks:
      - librechat
