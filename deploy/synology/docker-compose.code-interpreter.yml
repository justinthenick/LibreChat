version: "3.7"

# Synology-specific deployment of LibreChat-AI/code-interpreter.
# Source is checked out separately at the exact commit pinned by
# manage-code-interpreter.sh. Nothing in this stack is published on a host port.
# Only the Code API gateway joins LibreChat's existing Docker network.
services:
  codeapi:
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: service/Dockerfile
      target: api
    container_name: librechat-codeapi
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/codeapi.env
    environment:
      SERVICE_PORT: "3112"
      SANDBOX_ENDPOINT: http://sandbox:2000/api/v2
      EGRESS_GATEWAY_URL: http://egress:3190
      FILE_SERVER_URL: http://files:3000
      TOOL_CALL_SERVER_URL: http://tools:3033
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CODEAPI_EXECUTION_PROFILE: default
    depends_on:
      - redis
      - tools
    networks:
      codeapi:
      librechat:
        aliases:
          - librechat-codeapi

  worker:
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: service/Dockerfile
      target: worker
    container_name: librechat-codeapi-worker
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/codeapi.env
    environment:
      SANDBOX_ENDPOINT: http://sandbox:2000/api/v2
      EGRESS_GATEWAY_URL: http://egress:3190
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PYTHON_CONCURRENCY: "1"
      OTHER_CONCURRENCY: "2"
      WORKER_HEALTH_PORT: "3113"
      CODEAPI_EXECUTION_PROFILE: default
    depends_on:
      - redis
      - sandbox
    networks:
      - codeapi

  egress:
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: service/Dockerfile.egress-gateway
      target: production
    container_name: librechat-codeapi-egress
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/codeapi.env
    environment:
      SERVICE_NAME: egress-gateway
      EGRESS_GATEWAY_PORT: "3190"
      EGRESS_GATEWAY_FILE_SERVER_URL: http://files:3000
      EGRESS_GATEWAY_TOOL_CALL_SERVER_URL: http://tools:3033
      EGRESS_GATEWAY_MAX_TOOL_CALL_BYTES: "1048576"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - files
      - tools
      - redis
    networks:
      - codeapi

  tools:
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: service/Dockerfile.tool-call-server
      target: production
    container_name: librechat-codeapi-tools
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/codeapi.env
    environment:
      TOOL_CALL_SERVER_PORT: "3033"
      TOOL_CALL_REQUEST_TIMEOUT: "300000"
      TOOL_CALL_SESSION_EXPIRY: "600"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - redis
    networks:
      - codeapi

  sandbox:
    # Hardened path only: libkrun microVM + NsJail in the guest.  We do not
    # silently fall back to sandbox-runner-false because that shares the NAS
    # kernel and upstream explicitly classifies it as a development mode.
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: api/Dockerfile
      target: sandbox-runner-true
    container_name: librechat-codeapi-sandbox
    restart: unless-stopped
    privileged: false
    devices:
      - /dev/kvm:/dev/kvm
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/codeapi.env
    environment:
      KVM_ENABLED: "true"
      LAUNCHER_PACKAGES_HOST: /disabled-host-packages
      EGRESS_GATEWAY_URL: http://egress:3190
      SANDBOX_EXECUTE_BODY_LIMIT: 50mb
      SANDBOX_PACKAGES_DIRECTORY: /pkgs
      SANDBOX_LOG_LEVEL: INFO
      SANDBOX_OUTPUT_MAX_SIZE: "65536"
      SANDBOX_MAX_CONCURRENT_JOBS: "1"
      SANDBOX_PER_JOB_UIDS: "true"
      SANDBOX_JOB_UID_BASE: "200000"
      SANDBOX_JOB_GID_BASE: "200000"
      SANDBOX_WORKSPACE_REAPER_MAX_AGE_SECONDS: "3600"
      SANDBOX_RUN_TIMEOUT: "300000"
      SANDBOX_RUN_CPU_TIME: "300000"
      SANDBOX_COMPILE_TIMEOUT: "30000"
      LAUNCHER_VCPUS: "2"
      LAUNCHER_RAM_MIB: "2048"
      LAUNCHER_LOG_LEVEL: "2"
      SANDBOX_ALLOWED_LOCAL_NETWORK_PORT: "3190"
      SANDBOX_FORWARD_TARGET: egress:3190
      SANDBOX_REQUIRE_EGRESS_MANIFEST: "true"
      SANDBOX_RUNNER_CLOCK_SKEW_LIVENESS_LIMIT_SECONDS: "10"
      SANDBOX_RUNNER_HEALTHCHECK_TIMEOUT_SECONDS: "2"
    depends_on:
      - egress
    healthcheck:
      test: ["CMD", "/usr/local/bin/sandbox-runner-healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks:
      - codeapi

  files:
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: service/Dockerfile
      target: production
    container_name: librechat-codeapi-files
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/codeapi.env
    environment:
      FILE_SERVER_PORT: "3000"
      MINIO_BUCKET: codeapi
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - minio
      - redis
    networks:
      - codeapi

  redis:
    image: redis:7-alpine
    container_name: librechat-codeapi-redis
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/codeapi.env
    command: ["sh", "-lc", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - codeapi

  minio:
    image: quay.io/minio/minio
    container_name: librechat-codeapi-minio
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/codeapi.env
    command: server /data --console-address ":9001"
    volumes:
      - codeapi-minio-data:/data
    networks:
      - codeapi

networks:
  # User code is confined to this internal network and can reach only the
  # upstream egress gateway. The gateway itself mediates file/tool traffic.
  codeapi:
    driver: bridge
    internal: true
  # COMPOSE_PROJECT_NAME=librechat makes the existing base network name
  # deterministic on the NAS. Only the Code API gateway is attached here.
  librechat:
    external:
      name: librechat_librechat

volumes:
  codeapi-minio-data:
