version: "3.7"

# Synology control-plane deployment for LibreChat-AI/code-interpreter.
# The NAS has no /dev/kvm, so it NEVER executes model-generated code locally.
# Code execution is dispatched through the hardened paired remote bridge to a
# separate worker (initially WSL2 on Justin's Windows machine).
#
# Private env is split per service because hardened Code API explicitly rejects
# egress-grant material in API/worker processes and execution-signing private
# material does not belong in unrelated services.
services:
  codeapi:
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: service/Dockerfile
      target: api
    container_name: librechat-codeapi
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/api.env
    environment:
      SERVICE_PORT: "3112"
      EGRESS_GATEWAY_URL: http://egress:3190
      FILE_SERVER_URL: http://files:3000
      TOOL_CALL_SERVER_URL: http://tools:3033
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CODEAPI_SANDBOX_BACKEND: remote-bridge
      CODEAPI_EXECUTION_PROFILE: stateful
      CODEAPI_RUNTIME_SESSION_MODE: affinity
    # Loopback-only host listener. A remote worker reaches this through an SSH
    # tunnel (or a separately reviewed TLS/private-network route), never by a
    # publicly exposed NAS port.
    ports:
      - "127.0.0.1:3112:3112"
    depends_on:
      - redis
      - tools
    networks:
      codeapi:
      librechat:
        aliases:
          - librechat-codeapi

  worker:
    # This is the trusted BullMQ/service worker, NOT the code-execution worker.
    # It dispatches queued jobs to the outbound-connected remote bridge worker.
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: service/Dockerfile
      target: worker
    container_name: librechat-codeapi-worker
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/worker.env
    environment:
      EGRESS_GATEWAY_URL: http://egress:3190
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PYTHON_CONCURRENCY: "1"
      OTHER_CONCURRENCY: "1"
      WORKER_HEALTH_PORT: "3113"
      CODEAPI_SANDBOX_BACKEND: remote-bridge
      CODEAPI_EXECUTION_PROFILE: stateful
      CODEAPI_RUNTIME_SESSION_MODE: affinity
    depends_on:
      - redis
      - egress
    networks:
      - codeapi

  egress:
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: service/Dockerfile.egress-gateway
      target: production
    container_name: librechat-codeapi-egress
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/egress.env
    environment:
      SERVICE_NAME: egress-gateway
      EGRESS_GATEWAY_PORT: "3190"
      EGRESS_GATEWAY_FILE_SERVER_URL: http://files:3000
      EGRESS_GATEWAY_TOOL_CALL_SERVER_URL: http://tools:3033
      EGRESS_GATEWAY_MAX_TOOL_CALL_BYTES: "1048576"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - files
      - tools
      - redis
    networks:
      - codeapi

  tools:
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: service/Dockerfile.tool-call-server
      target: production
    container_name: librechat-codeapi-tools
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/tools.env
    environment:
      TOOL_CALL_SERVER_PORT: "3033"
      TOOL_CALL_REQUEST_TIMEOUT: "300000"
      TOOL_CALL_SESSION_EXPIRY: "600"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - redis
    networks:
      - codeapi

  files:
    build:
      context: /volume1/docker/librechat-code-interpreter
      dockerfile: service/Dockerfile
      target: production
    container_name: librechat-codeapi-files
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/files.env
    environment:
      FILE_SERVER_PORT: "3000"
      MINIO_BUCKET: codeapi
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - minio
      - redis
    networks:
      - codeapi

  redis:
    image: redis:7-alpine
    container_name: librechat-codeapi-redis
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/redis.env
    command: ["sh", "-lc", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - codeapi

  minio:
    image: quay.io/minio/minio
    container_name: librechat-codeapi-minio
    restart: unless-stopped
    env_file:
      - /volume1/docker/librechat-code-interpreter-data/minio.env
    command: server /data --console-address ":9001"
    volumes:
      - codeapi-minio-data:/data
    networks:
      - codeapi

networks:
  # No user-generated code runs on this network. It contains only the trusted
  # Code API control plane and its internal services.
  codeapi:
    driver: bridge
    internal: true
  # Existing LibreChat network. Only Code API joins it.
  librechat:
    external:
      name: librechat_librechat

volumes:
  codeapi-minio-data:
