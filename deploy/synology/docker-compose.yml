version: "3.7"

services:
  api:
    # Pinned upstream commit includes deployment-skill external IDs, native
    # agent handoff edges, and attached stateful Code Interpreter environments.
    # This pin is coordinated with the reviewed remote-bridge Code Interpreter
    # source pin; do not replace it with a moving latest/stable tag.
    image: librechat/lc-dev:f50c40e2f583b03262d600299e94e85411785fe3
    container_name: librechat
    restart: unless-stopped
    ports:
      - "${LIBRECHAT_PORT:-3200}:3080"
    env_file:
      - ./.env
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      CONFIG_PATH: /tmp/librechat.runtime.yaml
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
      RAG_API_URL: http://rag_api:8000
      DEPLOYMENT_SKILLS_DIR: /app/deployment-skills
      PRODUCTION_AGENTS_DIR: /app/production-agents
      DOMAIN_CLIENT: "${LIBRECHAT_SCHEME:-http}://${NAS_HOST}:${LIBRECHAT_PORT:-3200}"
      DOMAIN_SERVER: "${LIBRECHAT_SCHEME:-http}://${NAS_HOST}:${LIBRECHAT_PORT:-3200}"
      NO_INDEX: "${NO_INDEX:-true}"
      SEARCH: "${SEARCH:-false}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      ADMIN_PANEL_URL: "${ADMIN_PANEL_URL:-}"
      OPENROUTER_KEY: "${OPENROUTER_KEY:-}"
    # Render the reviewed YAML and seed the validated production agents before
    # starting the backend. Because npm run backend is reached only if the seed
    # exits successfully, the NAS /api/config health gate cannot report success
    # while the production-agent seed is missing or invalid.
    command:
      - sh
      - -lc
      - >-
        python3 /app/render-librechat-config.py
        --template /app/librechat.template.yaml
        --output /tmp/librechat.runtime.yaml
        && node /app/config/seed-production-agents.js /app/production-agents
        && exec npm run backend
    group_add:
      - "100"
    volumes:
      - ./librechat.yaml:/app/librechat.template.yaml:ro
      - ./render-librechat-config.py:/app/render-librechat-config.py:ro
      - /volume1/docker/librechat/config/seed-production-agents.js:/app/config/seed-production-agents.js:ro
      - /volume1/docker/librechat/custom/ba-agent/production:/app/production-agents:ro
      - /volume1/docker/librechat/custom/ba-agent/skills:/app/deployment-skills:ro
      - /volume1/docker/librechat/workspace:/workspace
      - librechat-data:/app/data
      - librechat-images:/app/client/public/images
      - librechat-uploads:/app/uploads
      - librechat-logs:/app/logs
    depends_on:
      - mongodb
      - rag_api
    networks:
      - librechat

  mongodb:
    image: mongo:4.4.18
    container_name: librechat-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - librechat

  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    container_name: librechat-rag-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_HOST: vectordb
      DB_PORT: "5432"
      POSTGRES_DB: librechat_rag
      POSTGRES_USER: librechat
      POSTGRES_PASSWORD: "${RAG_DB_PASSWORD}"
      RAG_PORT: "8000"
      JWT_SECRET: "${JWT_SECRET}"
      RAG_OPENAI_API_KEY: "${OPENROUTER_KEY}"
      RAG_OPENAI_BASEURL: https://openrouter.ai/api/v1
      EMBEDDINGS_PROVIDER: openai
      EMBEDDINGS_MODEL: openai/text-embedding-3-small
      EMBEDDING_BATCH_SIZE: "100"
      EMBEDDING_MAX_QUEUE_SIZE: "1"
      PARALLEL_EXECUTION: "1"
    depends_on:
      - vectordb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); raise SystemExit(0 if 200 <= r.status < 300 else 1)"
      interval: 10s
      timeout: 6s
      retries: 12
    networks:
      - librechat

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    container_name: librechat-vectordb
    restart: unless-stopped
    environment:
      POSTGRES_DB: librechat_rag
      POSTGRES_USER: librechat
      POSTGRES_PASSWORD: "${RAG_DB_PASSWORD}"
    volumes:
      - rag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librechat -d librechat_rag"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - librechat

networks:
  librechat:
    driver: bridge

volumes:
  mongo-data:
  rag-pgdata:
  librechat-data:
  librechat-images:
  librechat-uploads:
  librechat-logs:
