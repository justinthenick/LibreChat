version: "3.7"

# Optional Cloudflare Tunnel overlay for the Synology deployment.
# This file is intentionally NOT loaded by autodeploy.sh yet. It becomes active
# only when we explicitly add it to the compose command after a remotely managed
# Cloudflare Tunnel and Access policy have been created.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: librechat-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Store the real token only in deploy/synology/.env on the NAS.
      # Never commit a Cloudflare Tunnel token to GitHub.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    networks:
      - librechat
